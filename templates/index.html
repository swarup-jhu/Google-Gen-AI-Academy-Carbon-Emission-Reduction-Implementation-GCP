<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BigQuery Gemini Chatbot</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .wrap {
      height: 100vh;
      max-width: 980px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .card {
      height: 100%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    .title { font-size: 22px; font-weight: 700; }
    .sub { color: #666; margin-top: 6px; font-size: 14px; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      flex: 0 0 auto;
    }

    .suggestion-btn {
      border: 1px solid #d1d5db;
      background: #f9fafb;
      color: #111827;
      padding: 10px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.2;
    }

    .suggestion-btn:hover {
      background: #eef2ff;
      border-color: #c7d2fe;
    }

    .chat {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin: 20px 0;
      background: #fafafa;
      box-sizing: border-box;
    }

    .msg { margin: 10px 0; display: flex; }
    .msg.user { justify-content: flex-end; }

    .bubble {
      max-width: 75%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .assistant .bubble {
      background: white;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .typing {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: #6b7280;
      font-size: 14px;
      flex: 0 0 auto;
    }

    .dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 2px;
      background: #6b7280;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2){ animation-delay: .2s; }
    .dots span:nth-child(3){ animation-delay: .4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .controls {
      display: flex;
      gap: 10px;
      flex: 0 0 auto;
    }

    input[type=text] {
      flex: 1;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    button.secondary {
      background: #6b7280;
    }

    .statusline {
      margin-top: 10px;
      color: #374151;
      font-size: 14px;
      min-height: 20px;
      flex: 0 0 auto;
    }

    .meta {
      color: #6b7280;
      font-size: 13px;
      margin-top: 8px;
      flex: 0 0 auto;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <div>
          <div class="title">Carbon Emission Reduction Application for Logistics Company</div>
          <div class="sub">Table: {{ table_id }}</div>
        </div>
        <button class="secondary" onclick="clearChat()">Clear</button>
      </div>

      <div id="suggestions" class="suggestions"></div>

      <div id="chat" class="chat">
        {% for item in history %}
          <div class="msg {{ item.role }}">
            <div class="bubble">{{ item.text }}</div>
          </div>
        {% endfor %}
      </div>

      <div id="typing" class="typing">
        <div class="dots"><span></span><span></span><span></span></div>
        <div id="statusText">Thinking...</div>
      </div>

      <div class="controls">
        <input id="message" type="text" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') sendMessage();" />
        <button onclick="sendMessage()">Send</button>
      </div>

      <div id="statusLine" class="statusline"></div>

      <div class="meta">
        Live states: thinking, analyzing, searching, finalizing.
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const messageInput = document.getElementById("message");
    const typing = document.getElementById("typing");
    const statusText = document.getElementById("statusText");
    const statusLine = document.getElementById("statusLine");
    const suggestionsEl = document.getElementById("suggestions");

    const suggestions = [
      "How can we reduce fuel consumption in logistics operations?",
      "What are the best route optimization methods to cut emissions?",
      "How do electric vehicles help reduce carbon footprint in delivery fleets?",
      "What KPIs should we track for carbon emission reduction?"
    ];

    function renderSuggestions() {
      suggestionsEl.innerHTML = "";
      suggestions.forEach(text => {
        const btn = document.createElement("button");
        btn.className = "suggestion-btn";
        btn.type = "button";
        btn.textContent = text;
        btn.onclick = () => {
          messageInput.value = text;
          messageInput.focus();
        };
        suggestionsEl.appendChild(btn);
      });
    }

    function appendMessage(role, text) {
      const row = document.createElement("div");
      row.className = "msg " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function setStatus(stage, detail) {
      typing.style.display = "flex";
      statusText.textContent = detail ? `${stage}: ${detail}` : stage;
      statusLine.textContent = `${stage.toUpperCase()}${detail ? " — " + detail : ""}`;
    }

    function hideStatus() {
      typing.style.display = "none";
      statusLine.textContent = "";
    }

    async function pollStatus(chatId) {
      const interval = setInterval(async () => {
        try {
          const resp = await fetch(`/status/${chatId}`);
          const data = await resp.json();

          setStatus(data.status || "thinking", data.detail || "");

          if (data.done) {
            clearInterval(interval);
            hideStatus();
            if (data.answer) {
              appendMessage("assistant", data.answer);
              await fetch("/history/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_text: "", assistant_text: data.answer })
              });
            }
          }
        } catch (err) {
          clearInterval(interval);
          hideStatus();
          appendMessage("assistant", "Status polling failed: " + err);
        }
      }, 700);
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      appendMessage("user", text);
      messageInput.value = "";
      setStatus("thinking", "Message received");

      try {
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await resp.json();

        if (data.chat_id) {
          pollStatus(data.chat_id);
        } else {
          hideStatus();
          appendMessage("assistant", data.error || "Unknown error");
        }
      } catch (err) {
        hideStatus();
        appendMessage("assistant", "Request failed: " + err);
      }
    }

    async function clearChat() {
      await fetch("/clear", { method: "POST" });
      chat.innerHTML = "";
      hideStatus();
    }

    renderSuggestions();
  </script>
</body>
</html>
